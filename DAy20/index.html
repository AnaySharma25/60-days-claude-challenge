<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Face Puzzle Game</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#0a0f1e;
color:white;
min-height:100vh;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:20px;
}

.glass{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
border-radius:16px;
padding:20px;
margin-bottom:20px;
}

video{
width:100%;
max-width:500px;
border-radius:12px;
display:block;
margin:auto;
}

canvas{
display:none;
}

.controls{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-top:15px;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.primary{
background:#2563eb;
color:white;
}

.success{
background:#16a34a;
color:white;
}

.danger{
background:#dc2626;
color:white;
}

select{
padding:12px;
border-radius:10px;
border:none;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:rgba(255,255,255,.06);
padding:15px;
border-radius:12px;
text-align:center;
}

.card h3{
font-size:14px;
color:#ccc;
margin-bottom:8px;
}

.card p{
font-size:22px;
font-weight:bold;
}

#puzzleContainer{
position:relative;
margin:auto;
touch-action:none;
display:none;
background:#111827;
border-radius:12px;
overflow:hidden;
}

.piece{
position:absolute;
background-size:100% 100%;
border:2px solid transparent;
cursor:grab;
transition:.15s;
}

.dragging{
border:3px solid #f59e0b !important;
z-index:999;
}

.correct{
border:3px solid #22c55e !important;
}

#resultModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.modal-content{
width:90%;
max-width:500px;
padding:25px;
border-radius:20px;
background:#111827;
text-align:center;
}

.modal-content h2{
margin-bottom:15px;
}

.leaderboard{
margin-top:20px;
text-align:left;
}

.leaderboard table{
width:100%;
border-collapse:collapse;
}

.leaderboard th,
.leaderboard td{
padding:8px;
border-bottom:1px solid rgba(255,255,255,.1);
font-size:14px;
}

#permissionMessage{
text-align:center;
color:#f87171;
margin-top:15px;
}

@media(max-width:768px){

.card p{
font-size:18px;
}

button{
width:100%;
}

.controls{
flex-direction:column;
}

}
</style>
</head>

<body>

<div class="container">

<h1>🧩 AI Face Puzzle Game</h1>

<div class="glass">

<video id="video" autoplay playsinline></video>

<canvas id="snapshotCanvas"></canvas>

<div id="permissionMessage"></div>

<div class="controls">

<button class="primary" id="takePhotoBtn">
📸 Take Photo
</button>

<button class="danger" id="retakeBtn">
🔄 Retake Photo
</button>

<select id="difficulty">
<option value="3">3 × 3</option>
<option value="4">4 × 4</option>
<option value="5">5 × 5</option>
</select>

<button class="success" id="startPuzzleBtn">
▶ Start Puzzle
</button>

</div>

</div>

<div class="stats">

<div class="card">
<h3>Timer</h3>
<p id="timer">00:00.0</p>
</div>

<div class="card">
<h3>Moves</h3>
<p id="moves">0</p>
</div>

<div class="card">
<h3>Correct Pieces</h3>
<p id="correctCount">0</p>
</div>

<div class="card">
<h3>Difficulty</h3>
<p id="difficultyText">3 x 3</p>
</div>

</div>

<div id="puzzleContainer"></div>

</div>

<div id="resultModal">

<div class="modal-content">

<h2>🎉 Puzzle Solved!</h2>

<p id="finalTime"></p>
<p id="finalMoves"></p>
<p id="finalDifficulty"></p>

<div class="controls">

<button id="playAgainBtn" class="success">
Play Again
</button>

<button id="newPhotoBtn" class="primary">
New Photo
</button>

</div>

<div class="leaderboard">

<h3>🏆 Top 5 Best Results</h3>

<table>

<thead>
<tr>
<th>Date</th>
<th>Time</th>
<th>Moves</th>
<th>Grid</th>
</tr>
</thead>

<tbody id="leaderboardBody">

</tbody>

</table>

</div>

</div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("snapshotCanvas");
const ctx = canvas.getContext("2d");

const takePhotoBtn =
document.getElementById("takePhotoBtn");

const startPuzzleBtn =
document.getElementById("startPuzzleBtn");

const retakeBtn =
document.getElementById("retakeBtn");

const puzzleContainer =
document.getElementById("puzzleContainer");

let capturedImage = null;
let gridSize = 3;

let pieces = [];
let moves = 0;

let timerInterval;
let startTime;
// =========================
// CAMERA ACCESS
// =========================

async function startCamera(){

try{

const stream =
await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user"
},
audio:false
});

video.srcObject = stream;

}catch(error){

document.getElementById(
"permissionMessage"
).innerText =
"Camera permission denied. Please allow camera access.";

}

}

startCamera();


// =========================
// TAKE PHOTO
// =========================

takePhotoBtn.addEventListener("click",()=>{

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);

capturedImage = new Image();

capturedImage.onload = ()=>{

alert(
"Photo captured successfully!"
);

};

capturedImage.src =
canvas.toDataURL("image/png");

});


// =========================
// TIMER
// =========================

function startTimer(){

startTime = Date.now();

timerInterval = setInterval(()=>{

const elapsed =
Date.now() - startTime;

const minutes =
Math.floor(elapsed / 60000);

const seconds =
Math.floor(
(elapsed % 60000) / 1000
);

const tenths =
Math.floor(
(elapsed % 1000) / 100
);

document.getElementById(
"timer"
).innerText =
`${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}.${tenths}`;

},100);

}

function stopTimer(){

clearInterval(timerInterval);

}


// =========================
// START PUZZLE
// =========================

startPuzzleBtn.addEventListener("click",()=>{

if(!capturedImage){

alert(
"Please take a photo first."
);

return;

}

gridSize =
parseInt(
document.getElementById(
"difficulty"
).value
);

document.getElementById(
"difficultyText"
).innerText =
`${gridSize} x ${gridSize}`;

createPuzzle();

});


// =========================
// SHUFFLE ARRAY
// =========================

function shuffle(array){

for(
let i = array.length - 1;
i > 0;
i--
){

const j =
Math.floor(
Math.random() * (i + 1)
);

[array[i],array[j]]
=
[array[j],array[i]];

}

return array;

}


// =========================
// CREATE PUZZLE
// =========================

function createPuzzle(){

moves = 0;

document.getElementById(
"moves"
).innerText = 0;

pieces = [];

puzzleContainer.innerHTML = "";

const size =
Math.min(
window.innerWidth - 40,
600
);

puzzleContainer.style.width =
size + "px";

puzzleContainer.style.height =
size + "px";

puzzleContainer.style.display =
"block";

const pieceSize =
size / gridSize;

let positions = [];

for(
let i = 0;
i < gridSize * gridSize;
i++
){

positions.push(i);

}

shuffle(positions);

for(
let row = 0;
row < gridSize;
row++
){

for(
let col = 0;
col < gridSize;
col++
){

const correctIndex =
row * gridSize + col;

const currentPos =
positions[correctIndex];

const currentRow =
Math.floor(
currentPos / gridSize
);

const currentCol =
currentPos % gridSize;

const piece =
document.createElement("div");

piece.classList.add("piece");

piece.style.width =
pieceSize + "px";

piece.style.height =
pieceSize + "px";

piece.style.left =
(currentCol * pieceSize)
+ "px";

piece.style.top =
(currentRow * pieceSize)
+ "px";

piece.style.backgroundImage =
`url(${capturedImage.src})`;

piece.style.backgroundSize =
`${size}px ${size}px`;

piece.style.backgroundPosition =
`${-col * pieceSize}px ${-row * pieceSize}px`;

piece.dataset.correct =
correctIndex;

piece.dataset.current =
currentPos;

piece.dataset.row =
row;

piece.dataset.col =
col;

puzzleContainer.appendChild(piece);

pieces.push(piece);

}

}

enableDragging();

updateCorrectCount();

startTimer();

}

// =========================
// DRAG & TOUCH SUPPORT
// =========================

let draggedPiece = null;

function enableDragging(){

pieces.forEach(piece=>{

piece.draggable = true;

piece.addEventListener(
"dragstart",
dragStart
);

piece.addEventListener(
"dragover",
dragOver
);

piece.addEventListener(
"drop",
dropPiece
);

// TOUCH EVENTS

piece.addEventListener(
"touchstart",
touchStart,
{passive:false}
);

piece.addEventListener(
"touchmove",
touchMove,
{passive:false}
);

piece.addEventListener(
"touchend",
touchEnd
);

});

}


// =========================
// DESKTOP DRAG
// =========================

function dragStart(){

draggedPiece = this;

this.classList.add(
"dragging"
);

}

function dragOver(e){

e.preventDefault();

}

function dropPiece(e){

e.preventDefault();

if(
draggedPiece &&
draggedPiece !== this
){

swapPieces(
draggedPiece,
this
);

}

draggedPiece.classList.remove(
"dragging"
);

draggedPiece = null;

}


// =========================
// TOUCH DRAG
// =========================

let activeTouchPiece = null;

function touchStart(e){

activeTouchPiece = this;

this.classList.add(
"dragging"
);

}

function touchMove(e){

e.preventDefault();

const touch =
e.touches[0];

activeTouchPiece.style.left =
(
touch.clientX -
activeTouchPiece.offsetWidth/2
)
+ "px";

activeTouchPiece.style.top =
(
touch.clientY -
activeTouchPiece.offsetHeight/2
)
+ "px";

}

function touchEnd(e){

if(!activeTouchPiece)
return;

const touch =
e.changedTouches[0];

const target =
document.elementFromPoint(
touch.clientX,
touch.clientY
);

if(
target &&
target.classList.contains(
"piece"
) &&
target !== activeTouchPiece
){

swapPieces(
activeTouchPiece,
target
);

}else{

snapBack(
activeTouchPiece
);

}

activeTouchPiece.classList.remove(
"dragging"
);

activeTouchPiece = null;

}


// =========================
// SWAP LOGIC
// =========================

function swapPieces(
pieceA,
pieceB
){

const leftA =
pieceA.style.left;

const topA =
pieceA.style.top;

const currentA =
pieceA.dataset.current;

pieceA.style.left =
pieceB.style.left;

pieceA.style.top =
pieceB.style.top;

pieceA.dataset.current =
pieceB.dataset.current;

pieceB.style.left =
leftA;

pieceB.style.top =
topA;

pieceB.dataset.current =
currentA;

moves++;

document.getElementById(
"moves"
).innerText =
moves;

updateCorrectCount();

checkWin();

}


// =========================
// SNAP BACK
// =========================

function snapBack(piece){

const gridCell =
parseInt(
piece.dataset.current
);

const size =
puzzleContainer.offsetWidth;

const pieceSize =
size / gridSize;

const row =
Math.floor(
gridCell / gridSize
);

const col =
gridCell % gridSize;

piece.style.left =
(col * pieceSize)
+ "px";

piece.style.top =
(row * pieceSize)
+ "px";

}


// =========================
// CORRECT PIECES
// =========================

function updateCorrectCount(){

let correct = 0;

pieces.forEach(piece=>{

if(
piece.dataset.current ===
piece.dataset.correct
){

piece.classList.add(
"correct"
);

correct++;

}
else{

piece.classList.remove(
"correct"
);

}

});

document.getElementById(
"correctCount"
).innerText =
`${correct}/${pieces.length}`;

}

// =========================
// WIN DETECTION
// =========================

function checkWin(){

const solved =
pieces.every(piece =>
piece.dataset.current ===
piece.dataset.correct
);

if(solved){

stopTimer();

showResults();

}

}


// =========================
// RESULTS MODAL
// =========================

function showResults(){

const modal =
document.getElementById(
"resultModal"
);

modal.style.display =
"flex";

const finalTime =
document.getElementById(
"timer"
).innerText;

document.getElementById(
"finalTime"
).innerHTML =
`<strong>Time:</strong> ${finalTime}`;

document.getElementById(
"finalMoves"
).innerHTML =
`<strong>Moves:</strong> ${moves}`;

document.getElementById(
"finalDifficulty"
).innerHTML =
`<strong>Difficulty:</strong> ${gridSize} × ${gridSize}`;

saveLeaderboard(
finalTime,
moves,
gridSize
);

loadLeaderboard();

}


// =========================
// LEADERBOARD STORAGE
// =========================

function saveLeaderboard(
time,
moves,
difficulty
){

const data = {

date:
new Date().toLocaleDateString(),

time,
moves,
difficulty

};

let scores =
JSON.parse(
localStorage.getItem(
"facePuzzleLeaderboard"
)
) || [];

scores.push(data);

scores.sort((a,b)=>{

return a.time.localeCompare(
b.time
);

});

scores = scores.slice(0,5);

localStorage.setItem(
"facePuzzleLeaderboard",
JSON.stringify(scores)
);

}


// =========================
// LOAD LEADERBOARD
// =========================

function loadLeaderboard(){

const tbody =
document.getElementById(
"leaderboardBody"
);

tbody.innerHTML = "";

const scores =
JSON.parse(
localStorage.getItem(
"facePuzzleLeaderboard"
)
) || [];

scores.forEach(score=>{

const row =
document.createElement("tr");

row.innerHTML = `
<td>${score.date}</td>
<td>${score.time}</td>
<td>${score.moves}</td>
<td>${score.difficulty}×${score.difficulty}</td>
`;

tbody.appendChild(row);

});

}


// =========================
// PLAY AGAIN
// =========================

document.getElementById(
"playAgainBtn"
).addEventListener(
"click",
()=>{

document.getElementById(
"resultModal"
).style.display =
"none";

createPuzzle();

}
);


// =========================
// NEW PHOTO
// =========================

document.getElementById(
"newPhotoBtn"
).addEventListener(
"click",
()=>{

document.getElementById(
"resultModal"
).style.display =
"none";

puzzleContainer.innerHTML =
"";

puzzleContainer.style.display =
"none";

capturedImage = null;

document.getElementById(
"timer"
).innerText =
"00:00.0";

document.getElementById(
"moves"
).innerText =
"0";

document.getElementById(
"correctCount"
).innerText =
"0";

stopTimer();

alert(
"Take a new photo and start again."
);

}
);


// =========================
// RETAKE PHOTO
// =========================

retakeBtn.addEventListener(
"click",
()=>{

capturedImage = null;

alert(
"Photo cleared. Take a new photo."
);

}
);


// =========================
// RESPONSIVE RESIZE
// =========================

window.addEventListener(
"resize",
()=>{

if(
puzzleContainer.style.display
=== "block"
){

createPuzzle();

}

}
);


// =========================
// LOAD LEADERBOARD
// =========================

loadLeaderboard();

</script>

</body>
</html>
